services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  api:
    build: ./backend
    environment:
      MONGODB_URI: mongodb://mongo:27017/streamshelf
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - mongo

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo-data: